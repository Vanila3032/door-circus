<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Door Circus - Halloween</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a12; color: #eee; }
    .screen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; flex-direction: column; }
    .screen.active { display: flex; }

    #loginScreen { align-items: center; justify-content: center; background: radial-gradient(circle at 50% 20%, #2a1040 0%, #0a0a12 80%); z-index: 50; }
    .login-box { width: 90%; max-width: 420px; padding: 30px 24px; background: rgba(15, 10, 25, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(122, 60, 255, 0.4); border-radius: 20px; box-shadow: 0 0 30px rgba(122, 60, 255, 0.2); text-align: center; }
    .title-glow h1 { font-size: 32px; color: #ff6ad5; text-shadow: 0 0 10px #ff6ad5, 0 0 20px #ff6ad5; letter-spacing: 2px; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #9a8cc0; margin-bottom: 20px; text-transform: uppercase; }
    .input-frame { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(122, 60, 255, 0.3); border-radius: 12px; padding: 16px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px; }
    .input-frame input { width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(122, 60, 255, 0.2); border-radius: 8px; color: #fff; font-size: 16px; outline: none; }
    .input-frame input:focus { border-color: #ff6ad5; box-shadow: 0 0 10px rgba(255, 106, 213, 0.5); }
    .login-box button { width: 100%; padding: 16px; background: linear-gradient(135deg, #7a3cff, #ff6ad5); border: none; border-radius: 10px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
    .error { color: #ff5566; font-size: 13px; margin-top: 15px; min-height: 18px; }

    #lobbyScreen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100vw; height: 100vh; overflow: hidden; }
    #gameCanvas { width: 100%; height: 100%; display: block; }
    
    #hud { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; padding: 15px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 10; }
    
    .top-left-panel { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
    #onlineBadge { background: rgba(20, 14, 34, 0.85); border: 1px solid #4a3a70; border-radius: 20px; padding: 6px 14px; font-size: 13px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 4px; }
    #chatToggleBtn { background: rgba(122, 60, 255, 0.9); border: 2px solid #ff6ad5; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; pointer-events: auto; box-shadow: 0 0 15px rgba(122, 60, 255, 0.6); }
    #chatToggleBtn:active { background: #ff6ad5; transform: scale(0.95); }

    .top-right-panel { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
    #playerInfo { background: rgba(20, 14, 34, 0.85); border: 1px solid #4a3a70; border-radius: 20px; padding: 6px 14px; font-size: 13px; display: flex; align-items: center; gap: 10px; pointer-events: auto; }
    #playerInfo button { background: rgba(255, 85, 102, 0.2); border: 1px solid #ff5566; color: #ff5566; padding: 4px 10px; border-radius: 12px; font-size: 12px; cursor: pointer; }
    
    #wardrobeBtn { position: absolute; top: 70px; right: 15px; background: rgba(122, 60, 255, 0.95); border: 2px solid #ff6ad5; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; pointer-events: auto; z-index: 15; box-shadow: 0 0 15px rgba(255, 106, 213, 0.6); display: none; }
    #wardrobeBtn.show { display: block; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

    #controls { position: absolute; bottom: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; z-index: 10; }
    .move-btns { display: flex; gap: 15px; pointer-events: auto; }
    #controls button { width: 70px; height: 70px; border-radius: 50%; background: rgba(20, 10, 35, 0.6); border: 2px solid rgba(122, 60, 255, 0.8); color: #fff; font-size: 26px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    #controls button:active { background: rgba(122, 60, 255, 0.8); transform: scale(0.9); }
    #btnJump { pointer-events: auto; width: 85px; height: 85px; border-color: rgba(255, 106, 213, 0.8); }
    #btnJump:active { background: rgba(255, 106, 213, 0.8); }

    #chatPanel { position: absolute; top: 0; right: 0; bottom: 0; width: 100%; max-width: 350px; background: #0e0a18; border-left: 2px solid #4a3a70; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s; z-index: 20; }
    #chatPanel.open { transform: translateX(0); }
    .chat-header { padding: 15px; background: #150a25; border-bottom: 1px solid #2a2040; display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #ff6ad5; }
    #closeChatBtn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
    #chatMessages { flex: 1; overflow-y: auto; padding: 15px; font-size: 14px; display: flex; flex-direction: column; gap: 8px; }
    #chatMessages .msg { color: #c8bce8; }
    #chatMessages .msg .who { color: #ff6ad5; font-weight: bold; }
    #chatMessages .msg .sys { color: #7a9cff; font-style: italic; }
    #chatInputRow { display: flex; padding: 10px; gap: 10px; border-top: 1px solid #2a2040; background: #0a0712; }
    #chatInput { flex: 1; padding: 12px; background: #1a1428; border: 1px solid #4a3a70; border-radius: 8px; color: #fff; outline: none; }
    #sendBtn { width: 50px; background: linear-gradient(135deg, #7a3cff, #ff6ad5); border: none; border-radius: 8px; color: #fff; font-size: 18px; cursor: pointer; }

    #toast { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 20px; font-weight: bold; border: 1px solid #ff6ad5; z-index: 100; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

  <div id="loginScreen" class="screen active">
    <div class="login-box">
      <div class="title-glow"><h1>🎪 Door Circus</h1></div>
      <p class="subtitle">Войди в цирк дверей</p>
      <div class="input-frame">
        <input id="nickInput" type="text" placeholder="Никнейм" maxlength="16" autocomplete="off">
        <input id="passInput" type="password" placeholder="Пароль" maxlength="32">
      </div>
      <button id="loginBtn">Войти в игру</button>
      <p id="loginError" class="error"></p>
    </div>
  </div>

  <div id="lobbyScreen" class="screen">
    <canvas id="gameCanvas"></canvas>
    <div id="toast"></div>
    
    <div id="hud">
      <div class="top-left-panel">
        <div id="onlineBadge"><span id="onlineCount">0</span> в сети <span id="onlineDot">⚫</span></div>
        <button id="chatToggleBtn">💬 Чат</button>
      </div>
      <div class="top-right-panel">
        <div id="playerInfo"><span id="playerName">—</span><button id="logoutBtn">Выйти</button></div>
      </div>
    </div>
    
    <button id="wardrobeBtn">👗 Гардероб</button>

    <div id="controls">
      <div class="move-btns">
        <button id="btnLeft">◀</button>
        <button id="btnRight">▶</button>
      </div>
      <button id="btnJump">⤒</button>
    </div>
    
    <div id="chatPanel">
      <div class="chat-header"><span>Чат лобби</span><button id="closeChatBtn">✖</button></div>
      <div id="chatMessages"></div>
      <div id="chatInputRow">
        <input id="chatInput" type="text" placeholder="Сообщение..." maxlength="200">
        <button id="sendBtn">➤</button>
      </div>
    </div>
  </div>

  <script>
    const DOORS = [ { id: 'draw', x: 1200 }, { id: 'race', x: 1700 }, { id: 'jump', x: 2200 }, { id: 'jojo', x: 2700 }, { id: 'tadc', x: 3200 } ];
    const WARDROBE_X = 800;
    const BAR_X = 100;
    const BAR_TABLE = { x: BAR_X - 50, y: 0, w: 150, h: 40 };
    const DISCO_X = 3700; 
    const DISCO_WIDTH = 200; 

    const SEATS = [ { id: 'sofa1', x: 1400, w: 100, color: '#5a1a1a', type: 'sofa' }, { id: 'sofa2', x: 1950, w: 100, color: '#1a1a5a', type: 'sofa' } ];
    const PLANTS = [ { x: 1250 }, { x: 1550 }, { x: 2100 }, { x: 2350 } ];

    const state = {
      loggedIn: false, nick: '', myId: null,
      player: { x: 500, y: 0, vx: 0, vy: 0, w: 24, h: 64, onGround: false, facing: 1, gender: 'male', colorSkin: '#f1c27d', colorHair: '#3a2050', colorEyes: '#000000', colorShirt: '#7a3cff', colorPants: '#1a1a1a', hatType: 'none', hatColor: '#1a1a1a', isDancing: false, danceType: 0, danceTimer: 0 },
      otherPlayers: {}, camera: { x: 0 }, keys: { left: false, right: false, jump: false }, nearInteract: null, worldWidth: 4200, groundY: 0, time: 0, blinkTimer: 0, isBlinking: false
    };

    const $ = (id) => document.getElementById(id);
    const loginScreen = $('loginScreen'), lobbyScreen = $('lobbyScreen'), nickInput = $('nickInput'), passInput = $('passInput'), loginBtn = $('loginBtn'), loginError = $('loginError'), playerName = $('playerName'), logoutBtn = $('logoutBtn'), onlineCount = $('onlineCount'), onlineDot = $('onlineDot'), chatMessages = $('chatMessages'), chatInput = $('chatInput'), sendBtn = $('sendBtn'), canvas = $('gameCanvas'), ctx = canvas.getContext('2d'), chatPanel = $('chatPanel'), chatToggleBtn = $('chatToggleBtn'), closeChatBtn = $('closeChatBtn'), wardrobeBtn = $('wardrobeBtn'), toast = $('toast');
    let ws = null;

    function connectToServer() {
      const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
      ws = new WebSocket(`${protocol}${window.location.host}`);
      ws.onopen = () => { ws.send(JSON.stringify({ type: 'join', nick: state.nick, password: passInput.value.trim() || "123", appearance: state.player })); };
      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'authError') { loginError.textContent = data.message; state.loggedIn = false; lobbyScreen.classList.remove('active'); loginScreen.classList.add('active'); return; }
        if (data.type === 'authSuccess') {
            let s = data.player.appearance;
            if (s) { state.player.colorSkin = s.colorSkin; state.player.colorHair = s.colorHair; state.player.colorEyes = s.colorEyes; state.player.colorShirt = s.colorShirt; state.player.colorPants = s.colorPants; state.player.hatType = s.hatType; state.player.hatColor = s.hatColor; state.player.gender = s.gender; }
            state.player.x = data.player.x; state.player.y = data.player.y; state.player.facing = data.player.facing; state.myId = data.player.id;
            for (let p of data.others) { let op = p; if (op.appearance) op = { ...op, ...op.appearance }; state.otherPlayers[op.id] = op; }
            updateOnlineDisplay(data.others.length + 1); return;
        }
        if (data.type === 'playerJoined') { let op = data.player; if (op.appearance) op = { ...op, ...op.appearance }; state.otherPlayers[op.id] = op; updateOnlineDisplay(Object.keys(state.otherPlayers).length + 1); addSystemMessage(`${op.nick} зашел`); }
        if (data.type === 'playerMoved') { if (state.otherPlayers[data.id]) { state.otherPlayers[data.id].x = data.x; state.otherPlayers[data.id].y = data.y; state.otherPlayers[data.id].facing = data.facing; state.otherPlayers[data.id].isDancing = (data.x > DISCO_X - DISCO_WIDTH/2 && data.x < DISCO_X + DISCO_WIDTH/2); } }
        if (data.type === 'appearanceChanged') { if (state.otherPlayers[data.id] && data.appearance) state.otherPlayers[data.id] = { ...state.otherPlayers[data.id], ...data.appearance }; }
        if (data.type === 'playerLeft') { const p = state.otherPlayers[data.id]; if (p) { addSystemMessage(`${p.nick} вышел`); delete state.otherPlayers[data.id]; updateOnlineDisplay(Object.keys(state.otherPlayers).length + 1); } }
        if (data.type === 'chat') addChatMessage(data.nick, data.text);
      };
      ws.onclose = () => addSystemMessage("Связь потеряна!");
    }

    loginBtn.addEventListener('click', () => {
      const nick = nickInput.value.trim(); if (nick.length < 2) { loginError.textContent = 'Ник минимум 2 символа'; return; }
      loginError.textContent = ''; state.loggedIn = true; state.nick = nick; loginScreen.classList.remove('active'); lobbyScreen.classList.add('active'); playerName.textContent = nick;
      try { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); } catch (err) {}
      connectToServer(); setTimeout(() => { resizeCanvas(); requestAnimationFrame(loop); }, 100);
    });

    logoutBtn.addEventListener('click', () => { if (ws) ws.close(); state.loggedIn = false; lobbyScreen.classList.remove('active'); loginScreen.classList.add('active'); chatPanel.classList.remove('open'); });
    
    wardrobeBtn.addEventListener('click', () => {
        window.location.href = '/wardrobe.html?nick=' + state.nick;
    });

    let lastSentX = 0, sendTimer = 0;
    function updatePhysics(dt) {
      if (!state.loggedIn) return; const p = state.player; const speed = 4;
      
      p.vx = 0; 
      if (state.keys.left) { p.vx = -speed; p.facing = -1; } 
      if (state.keys.right) { p.vx = speed; p.facing = 1; } 
      p.x += p.vx;
      
      if (p.x < 0) p.x = 0; if (p.x + p.w > state.worldWidth) p.x = state.worldWidth - p.w;
      p.vy += 0.55; p.y += p.vy; p.onGround = false;
      if (p.x + p.w > BAR_TABLE.x && p.x < BAR_TABLE.x + BAR_TABLE.w) { if (p.y + p.h >= 0) { p.y = 0 - p.h; p.vy = 0; p.onGround = true; } }
      if (p.y + p.h >= 0) { p.y = 0 - p.h; p.vy = 0; p.onGround = true; }
      
      const onDisco = (p.x + p.w/2 > DISCO_X - DISCO_WIDTH/2 && p.x + p.w/2 < DISCO_X + DISCO_WIDTH/2);
      if (onDisco !== p.isDancing) {
          p.isDancing = onDisco;
          if (onDisco) { p.danceTimer = 0; p.danceType = Math.floor(Math.random() * 4); }
      }
      
      if (p.isDancing) {
          p.danceTimer += dt;
          // Меняем танец каждые 3 секунды (180 кадров)
          if (p.danceTimer > 180) { p.danceTimer = 0; p.danceType = Math.floor(Math.random() * 4); }
      }

      const targetCam = p.x + p.w/2 - canvas.width / 2; state.camera.x += (targetCam - state.camera.x) * 0.15;
      if (state.camera.x < 0) state.camera.x = 0; const maxCam = state.worldWidth - canvas.width; if (state.camera.x > maxCam) state.camera.x = maxCam;
      sendTimer += dt * 16.67;
      if (ws && ws.readyState === WebSocket.OPEN && (Math.abs(p.x - lastSentX) > 1 || sendTimer > 50)) { ws.send(JSON.stringify({ type: 'move', x: p.x, y: p.y, facing: p.facing })); lastSentX = p.x; sendTimer = 0; }
      
      const px = p.x + p.w/2;
      if (Math.abs(px - WARDROBE_X) < 60) { wardrobeBtn.classList.add('show'); } else { wardrobeBtn.classList.remove('show'); }
      
      state.time += dt; state.blinkTimer += dt; if (state.blinkTimer > 180) { state.isBlinking = true; if (state.blinkTimer > 190) { state.isBlinking = false; state.blinkTimer = 0; } }
    }

    function drawFurniture(camX, floorY) {
      for (let plant of PLANTS) { const px = plant.x - camX; if (px < -100 || px > canvas.width + 100) continue; ctx.fillStyle = '#8b4513'; ctx.beginPath(); ctx.moveTo(px - 15, floorY - 20); ctx.lineTo(px + 15, floorY - 20); ctx.lineTo(px + 10, floorY); ctx.lineTo(px - 10, floorY); ctx.fill(); ctx.fillStyle = '#2e8b57'; ctx.beginPath(); ctx.arc(px, floorY - 35, 20, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(px - 12, floorY - 25, 15, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(px + 12, floorY - 25, 15, 0, Math.PI*2); ctx.fill(); }
      for (let s of SEATS) { const sx = s.x - camX; if (sx < -150 || sx > canvas.width + 150) continue; if (s.type === 'sofa') { ctx.fillStyle = s.color; ctx.fillRect(sx - s.w/2, floorY - 40, s.w, 40); ctx.fillRect(sx - s.w/2 - 10, floorY - 25, 15, 25); ctx.fillRect(sx + s.w/2 - 5, floorY - 25, 15, 25); ctx.fillStyle = '#222'; ctx.fillRect(sx - s.w/2 + 5, floorY - 15, s.w - 10, 15); } }
    }

    function drawDisco(camX, floorY) {
      const dx = DISCO_X - camX; if (dx < -300 || dx > canvas.width + 300) return;
      const tile = 40; const startX = Math.floor((DISCO_X - DISCO_WIDTH/2) / tile) * tile; const endX = startX + DISCO_WIDTH + tile;
      
      // Танцпол
      for (let x = startX; x < endX; x += tile) { 
        const sx = x - camX; 
        if (sx < -tile || sx > canvas.width + tile) continue; 
        const hue = (state.time * 5 + x) % 360; 
        ctx.fillStyle = `hsl(${hue}, 100%, 50%)`; 
        ctx.fillRect(sx, floorY, tile, canvas.height - floorY); 
      }

      // Крутые колонки
      const speakerY = floorY - 70;
      const drawSpeaker = (sx) => {
        ctx.fillStyle = '#111';
        ctx.fillRect(sx - 15, speakerY, 30, 70);
        ctx.fillStyle = '#333';
        ctx.fillRect(sx - 12, speakerY + 5, 24, 20);
        ctx.fillRect(sx - 12, speakerY + 30, 24, 20);
        // Динамики с бликом
        ctx.fillStyle = '#555';
        ctx.beginPath(); ctx.arc(sx, speakerY + 15, 8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(sx, speakerY + 40, 8, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#222';
        ctx.beginPath(); ctx.arc(sx, speakerY + 15, 4, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(sx, speakerY + 40, 4, 0, Math.PI*2); ctx.fill();
      };
      drawSpeaker(dx - 120);
      drawSpeaker(dx + 120);

      // Реалистичный шар
      const ballY = floorY - 300 + Math.sin(state.time * 0.05) * 10; 
      ctx.fillStyle = '#555'; ctx.fillRect(dx - 1, 0, 2, ballY); 
      
      ctx.save(); ctx.translate(dx, ballY); 
      // Свет
      ctx.globalCompositeOperation = 'screen';
      for(let i=0; i<6; i++){ 
        ctx.save(); ctx.rotate(state.time*0.03 + i * (Math.PI*2/6)); 
        const grad = ctx.createLinearGradient(0, 0, 0, 500); 
        grad.addColorStop(0, 'rgba(255,255,255,0.2)'); 
        grad.addColorStop(1, 'rgba(255,255,255,0)'); 
        ctx.fillStyle = grad; 
        ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(-80, 500); ctx.lineTo(80, 500); ctx.lineTo(5, 0); ctx.fill(); 
        ctx.restore(); 
      }
      ctx.globalCompositeOperation = 'source-over';
      
      // Сам шар (сетка)
      ctx.fillStyle = '#ddd';
      ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#999';
      for(let i=-2; i<=2; i++) {
         ctx.fillRect(i*10 - 2, -25, 4, 50);
         ctx.fillRect(-25, i*10 - 2, 50, 4);
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-8, -8, 5, 0, Math.PI*2); ctx.fill(); // Блик

      ctx.restore();
    }

    function drawBar(camX, floorY) {
      const bx = BAR_X - camX;
      if (bx < -200 || bx > canvas.width + 200) return;
      
      const tableTop = floorY - BAR_TABLE.h; 
      const tableHeight = 100;
      
      // Бармен (за стойкой)
      const npcBob = Math.sin(state.time * 0.05) * 2;
      ctx.save(); ctx.translate(bx, tableTop - 50 + npcBob); ctx.scale(1.6, 1.6);
      ctx.fillStyle = '#1a1a1a'; ctx.fillRect(5, 42, 6, 18); ctx.fillRect(13, 42, 6, 18);
      ctx.fillStyle = '#000000'; ctx.fillRect(4, 24, 16, 18);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(8, 24, 8, 12); ctx.fillStyle = '#000000'; ctx.fillRect(11, 24, 2, 10); // Фартук
      ctx.fillStyle = '#f1c27d'; ctx.fillRect(0, 24, 4, 16); ctx.fillRect(20, 24, 4, 16); // Руки
      ctx.fillRect(3, 0, 18, 20); // Лицо
      ctx.fillStyle = '#3a2050'; ctx.fillRect(3, 0, 18, 6); // Волосы
      ctx.fillStyle = '#fff'; ctx.fillRect(6, 6, 5, 6); ctx.fillRect(13, 6, 5, 6);
      ctx.fillStyle = '#000'; ctx.fillRect(8, 8, 2, 3); ctx.fillRect(15, 8, 2, 3);
      ctx.fillStyle = '#000'; ctx.fillRect(7, 15, 10, 2); // Улыбка
      ctx.restore();

      // Стойка
      ctx.fillStyle = '#4a3020'; ctx.fillRect(bx - 60, tableTop, 150, tableHeight); 
      ctx.fillStyle = '#2a1a10'; ctx.fillRect(bx - 65, tableTop - 5, 160, 10); 
      
      // Бутылки на полке
      ctx.fillStyle = '#333'; ctx.fillRect(bx + 10, tableTop - 60, 100, 5);
      ctx.fillStyle = '#008000'; ctx.fillRect(bx + 20, tableTop - 80, 10, 20);
      ctx.fillStyle = '#ffaa00'; ctx.fillRect(bx + 60, tableTop - 75, 10, 15);
    }

    function drawWardrobe(camX, floorY) {
      const wx = WARDROBE_X - camX;
      if (wx < -150 || wx > canvas.width + 150) return;
      ctx.fillStyle = '#0a0512'; ctx.fillRect(wx - 40, floorY - 150, 80, 150); 
      ctx.fillStyle = '#05020a'; ctx.fillRect(wx - 35, floorY - 145, 70, 145); 
      ctx.fillStyle = '#c19a6b'; ctx.fillRect(wx - 35, floorY - 145, 50, 145); 
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(wx - 35, floorY - 145, 50, 145);
      ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(wx + 5, floorY - 75, 5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#7a3cff'; ctx.beginPath(); ctx.moveTo(wx - 35, floorY - 145); ctx.lineTo(wx + 15, floorY - 145); ctx.lineTo(wx + 5, floorY - 110); ctx.lineTo(wx - 25, floorY - 120); ctx.closePath(); ctx.fill();
    }

    function drawDoors(camX, floorY) {
      for (const d of DOORS) {
        const dx = d.x - camX; if (dx < -100 || dx > canvas.width + 100) continue; 
        const dh = 140, dw = 80, dy = floorY - dh, dxPos = dx - dw/2;
        
        // Рама
        ctx.fillStyle = '#111'; ctx.fillRect(dxPos - 6, dy - 6, dw + 12, dh + 12); 
        // Дверь
        ctx.fillStyle = '#2a1a3a'; ctx.fillRect(dxPos, dy, dw, dh);
        
        // Доски крест-накрест (с тенями)
        ctx.fillStyle = '#4a3020'; 
        ctx.save(); ctx.translate(dxPos + dw/2, dy + dh/2); ctx.rotate(Math.PI / 4); ctx.fillRect(-dw, -10, dw * 2, 20); ctx.restore();
        ctx.save(); ctx.translate(dxPos + dw/2, dy + dh/2); ctx.rotate(-Math.PI / 4); ctx.fillRect(-dw, -10, dw * 2, 20); ctx.restore();

        // Заклепки
        ctx.fillStyle = '#888';
        ctx.beginPath(); ctx.arc(dxPos + 5, dy + 5, 3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(dxPos + dw - 5, dy + 5, 3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(dxPos + 5, dy + dh - 5, 3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(dxPos + dw - 5, dy + dh - 5, 3, 0, Math.PI*2); ctx.fill();

        // Табличка
        ctx.fillStyle = 'rgba(0,0,0,0.9)'; ctx.fillRect(dxPos - 20, dy - 40, dw + 40, 25);
        ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 2; ctx.strokeRect(dxPos - 20, dy - 40, dw + 40, 25);
        ctx.fillStyle = '#ff0000'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('ЗАКРЫТО', dx, dy - 22); ctx.textAlign = 'left';
      }
    }

    function drawCharacter(p, camX, baseFloorY) {
      const px = p.x - camX; const py = baseFloorY + p.y; 
      ctx.save();
      
      ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(px + p.w/2, baseFloorY + 2, p.w/2 + 5, 6, 0, 0, Math.PI*2); ctx.fill();
      ctx.translate(px, py);
      
      // Танцы
      if (p.isDancing) { 
         if (p.danceType === 0) ctx.translate(0, Math.sin(state.time * 0.5) * 8); // Прыжки
         if (p.danceType === 1) { ctx.rotate(Math.sin(state.time * 0.2) * 0.1); ctx.translate(0, Math.sin(state.time * 0.5) * 4); } // Кручение
         if (p.danceType === 2) ctx.translate(Math.sin(state.time * 0.5) * 4, 0); // Качание влево-вправо
         if (p.danceType === 3) ctx.translate(0, Math.sin(state.time * 0.8) * 6); // Быстрые подпрыгивания
      } else if (p.vx === 0 && p.onGround) { 
         ctx.translate(0, Math.sin(state.time * 0.1) * 1.5); 
      }
      
      ctx.scale(1.6, 1.6);
      
      const cSkin = p.colorSkin || '#f1c27d', cHair = p.colorHair || '#3a2050', cShirt = p.colorShirt || '#7a3cff', cPants = p.colorPants || '#1a1a1a', isFemale = p.gender === 'female';

      ctx.fillStyle = cPants;
      if (p.vx !== 0 && p.onGround && !p.isDancing) { const walk = Math.sin(state.time * 0.5) * 3; ctx.fillRect(5, 42 + walk, 6, 18); ctx.fillRect(13, 42 - walk, 6, 18); } else { ctx.fillRect(5, 42, 6, 18); ctx.fillRect(13, 42, 6, 18); }
      
      ctx.fillStyle = cShirt; ctx.fillRect(4, 24, 16, 18);
      ctx.fillStyle = cSkin; 
      if (p.isDancing) {
          if (p.danceType === 3) { ctx.fillRect(0, 10 + Math.sin(state.time*0.8)*5, 4, 16); ctx.fillRect(20, 10 + Math.cos(state.time*0.8)*5, 4, 16); }
          else { ctx.fillRect(0, 24, 4, 16); ctx.fillRect(20, 24, 4, 16); }
      } else {
          ctx.fillRect(0, 24, 4, 16); ctx.fillRect(20, 24, 4, 16);
      }
      
      ctx.fillStyle = cSkin; ctx.fillRect(3, 0, 18, 20);
      
      // Глаза и поворот
      const eyeOffset = p.facing === 1 ? 2 : 0; 
      ctx.fillStyle = '#fff'; ctx.fillRect(6 + eyeOffset, 6, 5, 6); ctx.fillRect(13 + eyeOffset, 6, 5, 6);
      ctx.fillStyle = '#000'; ctx.fillRect(8 + eyeOffset, 8, 2, 3); ctx.fillRect(15 + eyeOffset, 8, 2, 3);
      
      // Улыбка
      ctx.fillStyle = '#000'; ctx.fillRect(9 + eyeOffset, 15, 6, 2);

      ctx.fillStyle = cHair; 
      if (isFemale) { ctx.fillRect(2, 0, 20, 8); ctx.fillRect(1, 8, 4, 14); ctx.fillRect(19, 8, 4, 14); } 
      else { ctx.fillRect(3, 0, 18, 6); }
      
      if (p.hatType === 'cap') { 
        ctx.fillStyle = p.hatColor; ctx.fillRect(3, 1, 18, 5); ctx.fillRect(15, 3, 8, 3); 
      }

      ctx.restore();
      
      if (p.nick) { ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(px - 10, py - 45, p.w + 20, 16); ctx.fillStyle = '#fff'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(p.nick, px + p.w/2, py - 33); ctx.textAlign = 'left'; }
    }

    function draw() {
      const w = canvas.width, h = canvas.height; const camX = Math.floor(state.camera.x); state.groundY = h - 80; 
      BAR_TABLE.y = state.groundY - BAR_TABLE.h; 
      
      const bg = ctx.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#1a0a2e'); bg.addColorStop(0.7, '#2a1040'); bg.addColorStop(1, '#0a0512'); ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
      
      ctx.strokeStyle = 'rgba(122, 60, 255, 0.15)'; ctx.lineWidth = 15; for (let x = Math.floor(camX / 600) * 600; x < camX + w + 600; x += 600) { ctx.beginPath(); ctx.arc(x - camX + 300, state.groundY - 150, 250, Math.PI, 0); ctx.stroke(); }
      
      const floorY = state.groundY, tile = 40; 
      for (let x = Math.floor(camX / tile) * tile; x < camX + w + tile; x += tile) { for (let y = floorY; y < h; y += tile) { const sx = x - camX; const isEven = (Math.floor(x / tile) + Math.floor(y / tile)) % 2 === 0; ctx.fillStyle = isEven ? '#1a0f2a' : '#2a1040'; ctx.fillRect(sx, y, tile, tile); } }
      ctx.fillStyle = '#4a3a70'; ctx.fillRect(0, floorY, w, 4);
      
      drawFurniture(camX, floorY);
      drawDisco(camX, floorY);
      drawBar(camX, floorY);
      drawWardrobe(camX, floorY);
      drawDoors(camX, floorY);

      for (let id in state.otherPlayers) { drawCharacter(state.otherPlayers[id], camX, floorY); }
      drawCharacter({ ...state.player, nick: state.nick }, camX, floorY);
    }

    let lastTime = 0;
    function loop(t) {
      if (!state.loggedIn) return; const dt = Math.min(50, t - lastTime) / 16.67; lastTime = t; updatePhysics(dt); draw();
      requestAnimationFrame(loop);
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect(); canvas.width = rect.width; canvas.height = rect.height;
      state.groundY = canvas.height - 80; state.player.y = state.groundY - state.player.h;
    }
    window.addEventListener('resize', () => { if (state.loggedIn) resizeCanvas(); });

    chatToggleBtn.addEventListener('click', () => { chatPanel.classList.add('open'); chatInput.focus(); });
    closeChatBtn.addEventListener('click', () => { chatPanel.classList.remove('open'); chatInput.blur(); });
    sendBtn.addEventListener('click', sendChat);
    chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
    function sendChat() { const text = chatInput.value.trim(); if (text && ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'chat', text: text })); chatInput.value = ''; }
    function addChatMessage(who, text) { const div = document.createElement('div'); div.className = 'msg'; div.innerHTML = `<span class="who">${escapeHtml(who)}:</span> ${escapeHtml(text)}`; chatMessages.appendChild(div); chatMessages.scrollTop = chatMessages.scrollHeight; }
    function addSystemMessage(text) { const div = document.createElement('div'); div.className = 'msg'; div.innerHTML = `<span class="sys">${escapeHtml(text)}</span>`; chatMessages.appendChild(div); chatMessages.scrollTop = chatMessages.scrollHeight; }
    function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
    function updateOnlineDisplay(count) { onlineCount.textContent = count; onlineDot.textContent = count > 0 ? '🟢' : '⚫'; }

    const btnLeft = $('btnLeft'), btnRight = $('btnRight'), btnJump = $('btnJump');
    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); state.keys.left = true; }, {passive: false}); btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); state.keys.left = false; }, {passive: false});
    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); state.keys.right = true; }, {passive: false}); btnRight.addEventListener('touchend', (e) => { e.preventDefault(); state.keys.right = false; }, {passive: false});
    btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); tryJump(); }, {passive: false});
    function tryJump() { if (state.player.onGround) { state.player.vy = -11; state.player.onGround = false; } }
  </script>
