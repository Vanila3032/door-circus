      });
    }
    createColorButtons('skinOptions', COLORS.skin, 'skin'); createColorButtons('hairOptions', COLORS.hair, 'hair'); createColorButtons('eyeOptions', COLORS.eyes, 'eyes'); createColorButtons('shirtOptions', COLORS.shirt, 'shirt'); createColorButtons('pantsOptions', COLORS.pants, 'pants'); createColorButtons('hatColorOptions', COLORS.hat, 'hat');

    document.querySelectorAll('.hat-btn').forEach(btn => {
      btn.onclick = () => { document.querySelectorAll('.hat-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); state.player.hatType = btn.dataset.hat; };
    });
    document.querySelectorAll('.gender-btn').forEach(btn => {
      btn.onclick = () => { document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); state.player.gender = btn.dataset.gender; };
    });

    function openWardrobe() { wardrobeMenu.classList.add('open'); drawPreview(); }
    closeWardrobeBtn.addEventListener('click', () => wardrobeMenu.classList.remove('open'));
    wearBtn.addEventListener('click', () => {
      wardrobeMenu.classList.remove('open'); showToast('Скин сохранен!');
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'updateAppearance', appearance: state.player }));
    });

    function drawPreview() { pCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height); drawCharacter(state.player, 0, 0, true, pCtx); }
  </script>
</body>
</html>
